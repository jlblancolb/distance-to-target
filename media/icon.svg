    <circle r="230" stroke="#5fd3c8" stroke-width="6" opacity="0.3"/>
    <line x1="0" y1="0" x2="186" y2="-186" stroke="#f3d58a" stroke-width="10" stroke-dasharray="4 22"/>
  </g></g>
  <!-- player -->
